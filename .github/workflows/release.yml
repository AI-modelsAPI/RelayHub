name: Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  # Required by actions/attest-build-provenance: persist the attestation to
  # the repo (shown on the commit/attestations page) and store artifact metadata.
  attestations: write
  artifact-metadata: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      # Full history so `git describe --tags` (version stamping in
      # build-macos.sh / verify-release.sh) is reliable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'

      - name: Build macOS DMGs
        run: ./scripts/build-macos.sh

      - name: Verify Release Artifacts
        run: ./scripts/verify-release.sh

      # The packaged shell is exercised on the runner's native architecture
      # (process ownership, health, fail-closed port conflict, flock, crash
      # watchdog). Release job previously never ran the desktop suite (RH-33).
      - name: Desktop lifecycle suite (native-arch bundle)
        run: |
          set -o pipefail
          # The suite spawns real processes; a single transient failure on a
          # busy shared runner must not block a release forever. Retry twice,
          # then annotate the last attempt's log so a real failure is
          # diagnosable without raw logs.
          for attempt in 1 2 3; do
            if python3 -m unittest -v tests.macos.test_desktop_lifecycle 2>&1 | tee lifecycle.log; then
              exit 0
            fi
            echo "::warning title=lifecycle::attempt ${attempt}/3 failed; retrying in 10s"
            sleep 10
          done
          python3 scripts/ci-annotate.py error lifecycle lifecycle.log || true
          exit 1

      - name: Generate SHA256SUMS
        run: |
          cd dist
          shasum -a 256 RelayHub-macOS-*.dmg > SHA256SUMS
          cat SHA256SUMS

      # Supply-chain: prove these DMGs were built by this repo's CI (AUDIT D1).
      # Binding the subjects to the published SHA256SUMS means the attestation
      # covers exactly the bytes being released. Users can verify offline with
      # `sigstore verify` / `gh attestation verify` using the attached bundle.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Collect attestation bundle
        run: |
          test -s "${RUNNER_TEMP}/created_attestation_paths.txt"
          n=1
          while IFS= read -r p; do
            cp "$p" "dist/build-provenance-$n.json"
            n=$((n + 1))
          done < "${RUNNER_TEMP}/created_attestation_paths.txt"
          ls -l dist/build-provenance-*.json
          echo "Attestation: ${{ steps.attest.outputs.attestation-url }}"

      - name: Write release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > release-notes.md <<EOF
          # RelayHub ${TAG}

          macOS 桌面版（Apple Silicon + Intel）。本版本包含 2026-09-24 安全审计的全部修复（F1–F21）。

          ## 重要行为变化（必读）

          - **管理 API 默认需要 token（F4）**：所有 /api/ 接口（含读取）需要 \`Authorization: Bearer <token>\`；例外仅 \`/api/v1/health\`、\`/healthz\` 和配对端点。首次启动会在数据目录生成 \`.data/management.token\` 并打印一次性配对链接。
          - 桌面版内嵌窗口自动携带 token，无需操作；浏览器访问请用启动时打印的 \`#pair=\` 链接或 \`relayhub pair\` 命令。
          - 恢复旧行为（不推荐）：配置 \`management_auth: off\`。
          - HTTP 代理仅接受绝对形式的请求（origin-form 返回 400）；代理默认禁止访问本机端口与云元数据地址。
          - 渠道 Key 在来源 origin 变化时会自动锁定，需要重新输入。
          - 导入/导出配置为 v3 格式（旧版本导出可导入，新版本导出旧版本不能读）。

          ## 安装

          1. 下载对应架构的 DMG（apple-silicon = Apple Silicon，intel = Intel）。
          2. 打开 DMG，把 RelayHub 拖进 Applications。

          **本版本未做代码签名和公证**（需要 Apple Developer 证书）。首次打开时 macOS Gatekeeper 会拦截，二选一：
          - 在 Finder 里**右键** RelayHub → 打开 → 再点"打开"；
          - 或终端执行：\`xattr -dr com.apple.quarantine /Applications/RelayHub.app\`

          ## 校验

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS
          \`\`\`

          附带的 \`build-provenance-*.json\` 是本仓库 CI 构建的证明（Sigstore bundle），可用 \`sigstore verify\` 或 \`gh attestation verify\` 离线核验。

          ---
          # RelayHub ${TAG}

          macOS desktop build (Apple Silicon + Intel). Includes every fix from the 2026-09-24 security audit (F1-F21).

          ## Breaking changes

          - **Management API is token-authenticated by default (F4)**; exceptions: \`/api/v1/health\`, \`/healthz\`, the pairing endpoints. The desktop webview carries the token automatically; browser access uses the one-time \`#pair=\` link or \`relayhub pair\`. Restore old behaviour with \`management_auth: off\`.
          - HTTP proxy only accepts absolute-form requests; proxying to local/metadata addresses is refused by default.
          - Channel keys lock when their origin changes. Config export/import is now v3.

          ## Install

          Open the DMG for your architecture and drag RelayHub to Applications. **This build is unsigned and not notarized** (needs an Apple Developer certificate): right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/RelayHub.app\`.

          Verify with \`shasum -a 256 -c SHA256SUMS\`; the attached \`build-provenance-*.json\` Sigstore bundle proves the build came from this repository's CI.
          EOF

      # Idempotent: an earlier failed run of the same tag may have left a
      # release behind (the first v0.1.0 run created it without assets).
      # Asset uploads are 1:1 on filenames, so stale assets from partial
      # runs are deleted before the fresh set is uploaded. (A previous
      # attempt also failed because it referenced dist/build-provenance.json
      # while the collect step names files build-provenance-N.json.)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          if gh release view "$TAG" --json id --jq .id > /dev/null 2>&1; then
            gh release edit "$TAG" --title "RelayHub ${TAG}" --notes-file release-notes.md
            echo "Refreshed existing release for ${TAG}"
          else
            gh release create "$TAG" --title "RelayHub ${TAG}" --notes-file release-notes.md
            echo "Created release for ${TAG}"
          fi

          for id in $(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].id' 2>/dev/null); do
            gh api -X DELETE "repos/${REPO}/releases/assets/${id}" > /dev/null \
              || gh api -X DELETE "repos/${REPO}/assets/${id}" > /dev/null
          done

          gh release upload "$TAG" \
            dist/RelayHub-macOS-apple-silicon.dmg \
            dist/RelayHub-macOS-intel.dmg \
            dist/SHA256SUMS \
            dist/build-provenance-*.json

          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmgs
          path: dist/*.dmg
          # Default artifact retention is 90 days; release binaries do not need
          # to linger that long on shared runners (AUDIT RH-04 CI hygiene).
          retention-days: 7
