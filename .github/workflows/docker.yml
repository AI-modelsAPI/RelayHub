name: Build Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Smoke Check (local amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: relayhub:test
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

      - name: Run Container Smoke Test
        run: ./tests/docker/smoke.sh relayhub:test

      - name: Image reports stamped version
        run: |
          OUT="$(docker run --rm relayhub:test -version)"
          echo "$OUT"
          case "$OUT" in
            *"0.0.0-dev"*|*"commit unknown"*) echo "ERROR: image is not version-stamped"; exit 1 ;;
          esac
