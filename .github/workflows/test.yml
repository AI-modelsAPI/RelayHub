name: Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Formatting Check
        run: |
          test -z "$(gofmt -l cmd internal tests)"

      # web/ is the editable source, internal/web/ the embedded copy; drift has
      # shipped stale assets before. The node suite also checks the
      # frontend -> mux route contract and that no shell control is dead.
      - name: Web asset contract & frontend tests
        run: make check-web test-web

      - name: Go Vet
        run: go vet ./...

      - name: Unit & Integration Tests (Race)
        run: |
          set -o pipefail
          go test -race ./... -count=1 -timeout=15m 2>&1 | tee test-output.log

      # Surface the failing test names as check annotations so a red run can
      # be understood from the PR checks tab / API without opening raw logs.
      - name: Summarize Test Failures
        if: failure()
        run: |
          [ -f test-output.log ] || exit 0
          grep -E '^(--- FAIL|FAIL[[:space:]]|panic:|WARNING: DATA RACE)' test-output.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=go test::${line}"
          done
          {
            echo '### Failing tests'
            echo '```'
            grep -E -A 12 '^(--- FAIL|panic:)' test-output.log | head -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Local Smoke Test
        run: ./scripts/smoke-local.sh

      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The desktop shell, the keychain key store and the packaged app only exist
  # on macOS; before this job they were exercised on tags only (release.yml).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true

      # Real /usr/bin/security against a throwaway keychain file; the login
      # keychain is never touched (AUDIT 2026-09-24 F18).
      - name: Keychain master key store (real security)
        env:
          RELAYHUB_KEYCHAIN_TEST: '1'
        run: |
          set -o pipefail
          go test ./internal/secrets -run Keychain -count=1 -v 2>&1 | tee keychain.log
          grep -E '^(--- |ok|FAIL)|keychain_darwin_test' keychain.log > keychain-summary.log || true
          python3 scripts/ci-annotate.py notice keychain keychain-summary.log

      # Compiles the Objective-C shell (desktop/macos/RelayHubApp/main.m).
      - name: Build macOS bundles
        run: ./scripts/build-macos.sh

      # Process ownership, health, fail-closed port conflict, flock, crash
      # watchdog, and the token-authenticated management API (AUDIT F4).
      # Retries twice: the suite spawns real processes and one transient
      # failure on a busy runner must not turn a green PR red.
      - name: Desktop lifecycle suite (native-arch bundle)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if python3 -m unittest -v tests.macos.test_desktop_lifecycle 2>&1 | tee lifecycle.log; then
              exit 0
            fi
            echo "::warning title=lifecycle::attempt ${attempt}/3 failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Summarize macOS failures
        if: failure()
        run: |
          python3 scripts/ci-annotate.py error keychain keychain.log
          python3 scripts/ci-annotate.py error lifecycle lifecycle.log
