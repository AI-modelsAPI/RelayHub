name: Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Formatting Check
        run: |
          test -z "$(gofmt -l cmd internal tests)"

      # web/ is the editable source, internal/web/ the embedded copy; drift has
      # shipped stale assets before. The node suite also checks the
      # frontend -> mux route contract and that no shell control is dead.
      - name: Web asset contract & frontend tests
        run: make check-web test-web

      - name: Go Vet
        run: go vet ./...

      - name: Unit & Integration Tests (Race)
        run: go test -race ./... -count=1 -timeout=15m

      - name: Local Smoke Test
        run: ./scripts/smoke-local.sh

      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
